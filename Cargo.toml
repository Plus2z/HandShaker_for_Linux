[workspace]
resolver = "2"
members = [
    "crates/handshaker-proto",
    "crates/handshaker-fuse",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HandShaker for Linux Contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
fuser = "0.18"
md-5 = "0.10"
mdns-sd = "0.11"
pbkdf2 = "0.12"
prost = "0.13"
prost-build = "0.13"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
