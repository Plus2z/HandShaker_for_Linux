[package]
name = "handshaker-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow.workspace = true
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
handshaker-proto = { path = "../crates/handshaker-proto" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[dev-dependencies]
tempfile = "3"
